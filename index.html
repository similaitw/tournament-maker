<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>賽事大師｜對戰樹與即時積分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{--bg:#f3f4f7;--card:#fff;--ink:#121826;--mute:#4f586c;--line:#d5d9e2;--nav:#0f1a2e;--acc:#ff5a1f;--acc2:#ffe8de;--win:#0e9f6e;--winbg:#e6f7f0;--warn:#b45309;--r:14px;--num:'Barlow Condensed','Noto Sans TC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:.5px;cursor:pointer;border:0;background:none;color:#fff;padding:0}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);font-size:16px}
.sync{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.sync.ok::before{content:'●';color:#4ade80;margin-right:5px}
.sync.busy::before{content:'●';color:#facc15;margin-right:5px}
.sync.ro::before,.sync.loc::before{content:'●';color:#94a3b8;margin-right:5px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.hero{background:linear-gradient(135deg,#0f1a2e 0%,#1d2f52 60%,#2a3f6b 100%);color:#fff;border-radius:20px;padding:28px 24px;position:relative;overflow:hidden;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:28px;font-weight:900}
.hero p{margin:0 0 18px;opacity:.8;max-width:560px;line-height:1.6}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,90,31,.25);pointer-events:none}
.hero .row{position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c7ccd6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.btn.danger{color:#c81e1e;border-color:#f3c2c2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tcard{cursor:pointer;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,26,46,.08)}
.tcard h3{margin:6px 0 4px;font-size:17px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#eef1f6;color:#3b4560}
.chip.acc{background:var(--acc2);color:#c2410c}
.chip.win{background:var(--winbg);color:var(--win)}
.muted{color:var(--mute);font-size:13px}
.bar{height:6px;background:#eef1f6;border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.sec-title{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:1px;margin:22px 0 10px}
.thead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.thead h1{margin:0;font-size:24px;font-weight:900}
.champ{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff4d6,#fff);border:1px solid #f6d77b;border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.champ .tro{font-size:28px}
.champ b{font-size:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
/* bracket */
.bscroll{overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:34px;min-width:max-content;padding:4px 2px}
.bcol{display:flex;flex-direction:column;width:210px}
.bcol h4{margin:0 0 10px;font-size:13px;color:var(--mute);text-align:center;font-weight:700}
.bmatches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.mc{background:#fff;border:1px solid var(--line);border-radius:11px;position:relative;font-size:14px}
.mc .mh{border-radius:10px 10px 0 0}.mc .mr:last-child{border-radius:0 0 10px 10px}
.bcol:not(:last-child):not(.last) .bmatches .mc::after{content:'';position:absolute;right:-35px;top:50%;width:34px;border-top:2px solid #d5d9e2}
.mc.click{cursor:pointer}
.mc.click:hover{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.mh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mute);padding:4px 10px;background:#f7f8fa;border-bottom:1px solid var(--line)}
.mr{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;gap:8px}
.mr+.mr{border-top:1px solid #f0f2f5}
.mr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .sc{font-family:var(--num);font-weight:700;font-size:18px;min-width:22px;text-align:right}
.mr.win{background:var(--winbg)}
.mr.win .nm{font-weight:700}
.mr.lose .nm{color:var(--mute)}
.mr i{color:#a0a7b6;font-style:normal}
.mc.skip{opacity:.5;padding:14px;text-align:center;color:var(--mute)}
.mc.live{border-color:var(--acc)}
.blabel{font-weight:900;font-size:16px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.blabel span{width:6px;height:18px;border-radius:3px;background:var(--acc)}
/* tables */
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:700;border-bottom:1px solid var(--line);background:#fafbfc}
td{border-bottom:1px solid #f0f2f5}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.pts{font-family:var(--num);font-weight:700;font-size:18px}
td.rk{font-family:var(--num);font-weight:700;color:var(--mute);width:36px}
tr.q td.rk{color:var(--acc)}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:700;color:#fff}
.form .W{background:var(--win)}.form .D{background:#9aa3b5}.form .L{background:#e0475b}.form .B{background:#6b8bd6}
.plink{background:none;border:0;padding:0;font-weight:600;text-align:left}
.plink:hover{color:var(--acc);text-decoration:underline}
.xt td{min-width:52px;font-family:var(--num);font-size:16px}
.xt td.self{background:#f1f3f6}
.xt td.w{color:var(--win);font-weight:700}.xt td.ls{color:#e0475b}
/* schedule */
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stime{font-size:13px;line-height:1.35}
.stime b{font-family:var(--num);font-size:19px;display:block}
.svs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.svs .a{text-align:right}
.svs .s{font-family:var(--num);font-weight:700;font-size:20px;background:#f3f4f7;border-radius:8px;padding:2px 10px;min-width:64px;text-align:center}
.svs .wn{font-weight:700}
.sact{display:flex;gap:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.fchip.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:99px;padding:7px 14px;background:#fff}
/* forms */
label.f{display:block;font-size:13px;font-weight:700;color:#3b4560;margin:12px 0 6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.inp:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.6}
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fmt{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:#fff}
.fmt b{display:block;font-size:14px;margin-bottom:3px}
.fmt span{font-size:12px;color:var(--mute);line-height:1.4;display:block}
.fmt.on{border-color:var(--acc);background:#fff8f5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--acc)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h2{margin:0 0 4px;font-size:19px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}
.side{text-align:center}
.side .n{font-weight:700;margin-bottom:8px;min-height:22px}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#f7f8fa;font-size:20px;font-weight:700}
.stepper input{width:66px;height:56px;text-align:center;font-family:var(--num);font-size:32px;font-weight:700;border:1.5px solid var(--line);border-radius:12px}
.vs{font-family:var(--num);font-weight:700;color:var(--mute);font-size:18px}
.pick{margin-top:14px;padding:12px;border-radius:12px;background:#fff8f0;border:1px solid #fbd9b6;font-size:13px}
.pick .row{margin-top:8px}
.err{color:#c81e1e;font-size:13px;margin-top:10px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty .big{font-size:44px;margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pitem .sd{font-family:var(--num);font-weight:700;color:var(--mute);width:26px;text-align:center}
.pitem input{flex:1;border:0;padding:6px;border-radius:6px;min-width:0}
.pitem input:focus{outline:2px solid var(--acc2)}
.ib{border:0;background:#f3f4f7;border-radius:8px;width:32px;height:32px;font-size:14px}
.ib:disabled{opacity:.3}
.note{background:#f7f8fa;border-radius:10px;padding:10px 12px;font-size:13px;color:#4a5368;line-height:1.6;margin-top:10px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gwrap h3{margin:0 0 8px;font-size:16px}
/* TV */
.tv{position:fixed;inset:0;z-index:90;background:#0b1322;color:#fff;overflow:auto;padding:24px 28px}
.tv .tvh{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.tv h1{margin:0;font-size:34px;font-weight:900}
.tv .clock{margin-left:auto;font-family:var(--num);font-size:36px;font-weight:700;opacity:.85}
.tvg{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:900px){.tvg{grid-template-columns:1fr}}
.tv .panel{background:#131e33;border-radius:18px;padding:18px}
.tv .panel h2{margin:0 0 12px;font-size:16px;color:#94a3b8;letter-spacing:1px}
.tv table{font-size:20px}.tv th{background:transparent;color:#94a3b8;border-color:#24324d;font-size:14px}
.tv td{border-color:#1c2a44;color:#fff}
.tv .tblw{background:transparent;border-color:#24324d}
.tv .plink{color:#fff;font-size:inherit}
.tv td.rk{color:#94a3b8}.tv tr.q td.rk{color:#ff8a5c}
.tv .gwrap h3{color:#fff}.tv td.pts{font-size:26px;color:#ffb38f}
.tv .mc{background:#1a2740;border-color:#2a3a5a;color:#fff}.tv .mh{background:#15213a;border-color:#2a3a5a}
.tv .mr+.mr{border-color:#24324d}.tv .mr.win{background:#11402f}
.tv .bcol h4{color:#94a3b8}
.tvm{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1f2d48;font-size:18px}
.tvm b{font-family:var(--num);font-size:22px;color:#ffb38f}
.tv .btn{background:#1a2740;border-color:#2a3a5a;color:#fff}
@media(max-width:640px){
 .hero h1{font-size:23px}
 .srow{grid-template-columns:1fr;gap:8px}
 .stime{display:flex;gap:8px;align-items:baseline}
 .stime b{display:inline;font-size:16px}
 .sact{justify-content:flex-end}
 .bcol{width:180px}
 .hide-sm{display:none}
 .two,.three{grid-template-columns:1fr 1fr}
 .thead h1{font-size:21px}
}
/* 字級：投影用大字 */
body.fs-big .top,body.fs-big .wrap{zoom:1.3}
body.fs-xl .top,body.fs-xl .wrap{zoom:1.6}
@media(min-width:700px){body.fs-big .modal{zoom:1.25}body.fs-xl .modal{zoom:1.45}}
body.fs-big .tv,body.fs-xl .tv{zoom:1.25}
@media(min-width:1400px){body.fs-xl .tv{zoom:1.5}}
body.fs-big .mr,body.fs-xl .mr{padding:9px 12px}
body.fs-big .mr .nm,body.fs-xl .mr .nm{font-weight:600}
body.fs-big .mr.win,body.fs-xl .mr.win{background:#d3f2e4}
body.fs-big .bcol:not(:last-child):not(.last) .bmatches .mc::after,body.fs-xl .bcol:not(:last-child):not(.last) .bmatches .mc::after{border-top:3px solid #aab2c2}
body.fs-big .mc,body.fs-xl .mc{border-width:1.5px}
body.fs-big td,body.fs-xl td{font-weight:500}
.fsbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.sync{margin-left:auto}
.top .fsbtn{margin-left:8px}
</style>

<body>
<div id="root"></div>
<script type="application/json" id="state">{"tournaments":[],"updated":0}</script>
<script id="app-script">
(function(){
'use strict';
var S;
try{S=JSON.parse(document.getElementById('state').textContent||'{}')}catch(e){S={}}
if(!S.tournaments)S.tournaments=[];
var root=document.getElementById('root');
var ui={view:'home',tid:null,tab:'bracket',filter:'all',q:'',tv:false};
var art=null,mode='loading',pubTimer=null,dirty=false;
var cache=new Map();
var modalCtx={};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
function pow2(n){var p=1;while(p<n)p*=2;return p}
function log2(n){return Math.round(Math.log(n)/Math.LN2)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function seedOrder(n){var a=[1,2];while(a.length<n){var L=a.length*2+1,b=[];a.forEach(function(s){b.push(s,L-s)});a=b}return a.slice(0,n)}
function T(){return S.tournaments.find(function(x){return x.id===ui.tid})}
function byId(t,id){return t.matches.find(function(m){return m.id===id})}
function pmap(t){var k='pm'+t.id;if(!cache.has(k)){var o={};t.participants.forEach(function(p){o[p.id]=p});cache.set(k,o)}return cache.get(k)}
function pn(t,id){if(id===undefined)return '<i>待定</i>';if(id===null)return '<i>輪空</i>';if(id==='SKIP')return '<i>—</i>';var p=pmap(t)[id];return p?esc(p.name):'<i>?</i>'}
function pnText(t,id){var p=pmap(t)[id];return p?p.name:(id===null?'輪空':'待定')}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
var KO={main:1,wb:1,lb:1,gf:1,ko:1};
var FMT={se:'單淘汰',de:'雙淘汰',rr:'循環賽',swiss:'瑞士制',groups:'分組＋淘汰'};
var FMTD={se:'輸一場就淘汰，最快產生冠軍',de:'輸兩場才淘汰，有勝部與敗部',rr:'每隊都互相交手，看積分',swiss:'依戰績配對，固定輪數',groups:'先分組循環，前幾名進淘汰賽'};
var SPORTS={
 '足球':{win:3,draw:1,loss:0,allowDraw:true},
 '籃球':{win:2,draw:0,loss:1,allowDraw:false},
 '排球':{win:3,draw:0,loss:0,allowDraw:false},
 '羽球':{win:1,draw:0,loss:0,allowDraw:false},
 '桌球':{win:1,draw:0,loss:0,allowDraw:false},
 '電競':{win:3,draw:1,loss:0,allowDraw:true},
 '棋類':{win:1,draw:0.5,loss:0,allowDraw:true},
 '其他':{win:3,draw:1,loss:0,allowDraw:true}
};

/* ---------- generators ---------- */
function genSE(ids,stage,third,forceSize){
 var size=forceSize||pow2(Math.max(2,ids.length)),order=seedOrder(size),R=log2(size),M=[],prev=[];
 for(var r=1;r<=R;r++){var cnt=size>>r,cur=[];
  for(var i=0;i<cnt;i++){var id=stage+'-'+r+'-'+(i+1),a,b;
   if(r===1){a={t:'p',v:ids[order[2*i]-1]===undefined?null:ids[order[2*i]-1]};b={t:'p',v:ids[order[2*i+1]-1]===undefined?null:ids[order[2*i+1]-1]}}
   else{a={t:'W',m:prev[2*i]};b={t:'W',m:prev[2*i+1]}}
   M.push({id:id,stage:stage,round:r,idx:i,a:a,b:b,depth:r,R:R});cur.push(id)}
  prev=cur}
 if(third&&R>=2){var semis=M.filter(function(m){return m.round===R-1}).map(function(m){return m.id});
  M.push({id:stage+'-3rd',stage:stage,round:R,idx:1,a:{t:'L',m:semis[0]},b:{t:'L',m:semis[1]},third:true,depth:R-0.5,R:R})}
 return M}
function genDE(ids){
 var size=pow2(Math.max(4,ids.length)),k=log2(size);
 var M=genSE(ids,'wb',false,size);
 var wb=function(r){return M.filter(function(m){return m.stage==='wb'&&m.round===r}).map(function(m){return m.id})};
 var prev=null,LR=2*(k-1);
 for(var j=1;j<=LR;j++){var cur=[],cnt,i,id;
  if(j===1){var w1=wb(1);cnt=size/4;for(i=0;i<cnt;i++){id='lb-1-'+(i+1);M.push({id:id,stage:'lb',round:1,idx:i,a:{t:'L',m:w1[2*i]},b:{t:'L',m:w1[2*i+1]},depth:1,LR:LR});cur.push(id)}}

  if(m.stage==='swiss'&&typeof a==='string'&&b===null&&rows[a]){var ra=rows[a];ra.P++;ra.W++;ra.Pts+=c.win;ra.form.push('B');return}
  var o=outcome(t,m);if(!o.done||!rows[a]||!rows[b])return;var r=validRes(t,m),A=rows[a],B=rows[b];
  A.P++;B.P++;A.F+=r.sa;A.A+=r.sb;B.F+=r.sb;B.A+=r.sa;A.opp.push(b);B.opp.push(a);

 mv:function(el){var t=T(),i=t.participants.findIndex(function(p){return p.id===el.dataset.p}),j=i+Number(el.dataset.d);if(j<0||j>=t.participants.length)return;var x=t.participants[i];t.participants[i]=t.participants[j];t.participants[j]=x;build(t);save()},

 addPOk:function(){var t=T(),ns=document.getElementById('ap').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);if(!ns.length){closeModal();return}ns.forEach(function(n){t.participants.push({id:uid(),name:n})});build(t);closeModal();save()},
 delP:function(el){var t=T(),p=pmap(t)[el.dataset.p];confirmBox('移除「'+esc(p.name)+'」？','移除後會重新產生賽程。',function(){if(t.participants.length<=2){toast('至少需要 2 隊');return}t.participants=t.participants.filter(function(x){return x.id!==p.id});build(t);save()},'移除')},
 saveSettings:function(){var t=T(),g=function(id){return document.getElementById(id)};t.name=g('s_name').value.trim()||t.name;t.sport=g('s_sport').value.trim()||t.sport;
  if(g('s_win')){t.cfg.win=Number(g('s_win').value);t.cfg.draw=Number(g('s_draw').value);t.cfg.loss=Number(g('s_loss').value);t.cfg.allowDraw=g('s_ad').checked}
  if(g('s_sr'))t.cfg.swissRounds=Math.max(swissRoundNo(t),parseInt(g('s_sr').value)||1);save();toast('設定已儲存')},
 rebuild:function(){confirmBox('重新產生賽程？','所有比分都會被清除，且無法復原。',function(){build(T());save();toast('賽程已重新產生')},'重新產生')},
 clearRes:function(){confirmBox('清除所有比分？','對戰樹與積分榜將回到初始狀態。',function(){var t=T();t.results={};if(t.format==='groups')t.matches=t.matches.filter(function(m){return m.stage!=='ko'});if(t.format==='swiss'){t.matches=[];swissNext(t)}save()},'清除')},
 delT:function(){var t=T(),own=isOwn(t);confirmBox((own?'刪除':'移除')+'「'+esc(t.name)+'」？',own?'賽事與所有比分都會刪除'+(mode==='cloud'?'（包含雲端資料，觀看連結也會失效）':'')+'，無法復原。':'只會從你的清單移除，不影響主辦人的賽事。',function(){S.tournaments=S.tournaments.filter(function(x){return x.id!==t.id});if(mode==='cloud')cloudDelete(t.id);go('home');save()},own?'刪除':'移除')},
 export:function(){var txt=JSON.stringify(T(),null,1);copy(txt,'已複製賽事資料，可貼到其他地方保存或匯入')},
 import:function(){openModal('<h2>匯入賽事</h2><div class="muted">貼上先前「複製賽事資料」得到的 JSON。</div><textarea class="inp" id="imp" style="margin-top:10px"></textarea><div class="err" id="imperr"></div><div class="mfoot"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="impOk">匯入</button></div>')},
 impOk:function(){try{var o=JSON.parse(document.getElementById('imp').value),list=o.tournaments||[o];list.forEach(function(t){if(!t.participants||!t.matches||!t.format)throw 0;if(mode==='cloud'||S.tournaments.some(function(x){return x.id===t.id}))t.id=uid();KEYS[t.id]=newKey();delete t.updated;t.results=t.results||{};t.sched=t.sched||{};S.tournaments.push(t)});closeModal();save();toast('匯入 '+list.length+' 個賽事')}catch(e){document.getElementById('imperr').textContent='格式不正確，請確認貼上的是完整 JSON'}},
 share:function(){var t=T();
  if(mode!=='cloud'){copy(location.href,mode==='shared'?'已複製連結。記得在 claude.ai 的分享設定開放給對方檢視':'已複製連結（資料存在這台裝置的瀏覽器，可用「複製賽事資料」轉移）');return}
  var base=location.origin+location.pathname+'#t-'+t.id+'-'+tabsFor(t)[0][0],own=!!KEYS[t.id];
  openModal('<h2>分享賽事</h2><label class="f">👀 觀看連結（給選手、觀眾）</label><div class="row" style="flex-wrap:nowrap"><input class="inp" readonly value="'+esc(base)+'" onclick="this.select()"><button class="btn sm" data-act="copyLink" data-u="'+esc(base)+'">複製</button></div><div class="muted" style="margin-top:6px">打開就能看對戰樹、賽程與積分，每 8 秒自動更新，不能修改。</div>'+
   (own?'<label class="f" style="margin-top:18px">🔑 管理連結（給共同主辦、計分人員）</label><div class="row" style="flex-wrap:nowrap"><input class="inp" readonly value="'+esc(base+'-k-'+KEYS[t.id])+'" onclick="this.select()"><button class="btn sm" data-act="copyLink" data-u="'+esc(base+'-k-'+KEYS[t.id])+'">複製</button></div><div class="note">⚠️ 拿到管理連結的人可以修改比分與設定，請只給信任的人。你換手機或電腦時，也用這個連結打開就能繼續管理。</div>':'')+
   '<div class="mfoot"><button class="btn" data-act="close">關閉</button></div>')},
 copyLink:function(el){copy(el.dataset.u,'已複製連結')},
 pwLogin:function(){var t=T();openModal('<h2>輸入管理密碼</h2><div class="muted">「'+esc(t.name)+'」</div><label class="f">管理密碼</label><input class="inp" type="password" id="lpw" autocomplete="current-password"><div class="err" id="lerr"></div><div class="mfoot"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="pwLoginOk">登入管理</button></div>');setTimeout(function(){var i=document.getElementById('lpw');if(i)i.focus()},50)},
 pwLoginOk:function(el){var id=ui.tid,pw=document.getElementById('lpw').value,err=document.getElementById('lerr');if(!pw){err.textContent='請輸入密碼';return}
  el.disabled=true;err.textContent='驗證中…';
  apiPost(id,'login',{password:pw}).then(function(x){el.disabled=false;
   if(x.s===200&&x.j.key){KEYS[id]=x.j.key;delete VIEW[id];lsSave();closeModal();pull(id,true).then(function(){render()});toast('已取得管理權限')}
   else err.textContent=x.s===401?'密碼錯誤':'登入失敗，請稍後再試'})},
 pwSet:function(el){var id=ui.tid,a=document.getElementById('pw1').value,b=document.getElementById('pw2').value,err=document.getElementById('pwerr');
  if(a.length<4){err.textContent='密碼至少要 4 個字';return}if(a!==b){err.textContent='兩次輸入的密碼不一樣';return}
  if(synced[id]===undefined||synced[id]!==tJSON(T())){err.textContent='資料還在同步中，請稍等幾秒再試';cloudSync();return}
  el.disabled=true;setPw(id,a).then(function(x){el.disabled=false;if(x.s===200){render();toast('管理密碼已設定')}else err.textContent='設定失敗，請稍後再試'})},
 pwDel:function(){var id=ui.tid;confirmBox('移除管理密碼？','移除後只能用管理連結取得管理權限。',function(){setPw(id,null).then(function(x){render();toast(x.s===200?'已移除管理密碼':'移除失敗')})},'移除')},
 rotate:function(){var id=ui.tid;confirmBox('重設管理權限？','舊的管理連結和管理密碼都會失效，其他裝置會變成只能觀看。只有這台裝置保留管理權限。',function(){var nk=newKey();apiPost(id,'rotate',{key:KEYS[id],newKey:nk}).then(function(x){if(x.s===200){KEYS[id]=nk;HASPW[id]=false;lsSave();render();toast('已重設，記得重新設定密碼或分享新的管理連結')}else toast('重設失敗，請稍後再試')})},'重設')},
 tv:function(){ui.tv=true;renderTV();clearInterval(tvTimer);tvTimer=setInterval(function(){if(ui.tv){cache.clear();renderTV()}},20000);try{var p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}},
 tvClose:closeTV,
 fs:function(){fs=FS[(FS.indexOf(fs)+1)%FS.length];try{localStorage.setItem('tm-fs',fs)}catch(e){}applyFs();render();toast('字級：'+FSL[fs])}
};

function fallbackCopy(txt){openModal('<h2>請手動複製</h2><textarea class="inp" readonly onclick="this.select()">'+esc(txt)+'</textarea><div class="mfoot"><button class="btn" data-act="close">關閉</button></div>')}

document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;var f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});

 if(e.target.id==='sa'||e.target.id==='sb')updPick();
 if(e.target.id==='n_ps'){var n=e.target.value.split('\n').filter(function(s){return s.trim()}).length;document.getElementById('n_cnt').textContent=n+' 隊'}
 if(e.target.id==='n_sport'){newCfg.sport=e.target.value}

 if(e.key==='Enter'&&document.getElementById('sa')&&(e.target.id==='sa'||e.target.id==='sb'))A.saveScore()});

readHash();render();initArt();
